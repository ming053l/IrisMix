[build-system]
requires = ["setuptools>=62.6"]
build-backend = "setuptools.build_meta"

[project]
name = "irismix"
version = "1.0.0"
description = "IrisMix: compositional makeup transfer with layered diffusion transformers"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dynamic = ["dependencies"]
authors = [{name = "Chia-Ming Lee"}, {name = "Ming-Ching Chang"}, {name = "Xin Li"}, {name = "Hong-Han Shuai"}, {name = "Yu-Lun Liu"}, {name = "Chih-Chung Hsu"}]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://ming053l.github.io/IrisMix/"
Demo = "https://ming053l.github.io/IrisMix-demo/"
Repository = "https://github.com/ming053l/IrisMix"

[project.scripts]
irismix-viewer = "irismix.viewer.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools]
packages = ["irismix", "irismix.viewer"]

[tool.setuptools.package-data]
"irismix" = ["data/*.json"]
"irismix.viewer" = ["static/*.html", "static/*.js"]
